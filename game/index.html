<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>TIDEBINDER — storm salvage in the flooded clockwork harbour</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04070f; }
  #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #eaf6ff; font: 500 18px system-ui, sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="TIDEBINDER: steer the rescue skiff with WASD or the arrow keys, aim with the mouse, hold Space or the left mouse button to tether the nearest amber salvage and tow it into the lighthouse ring, dash with Shift, and rescue the quota of cargo across three storm waves"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript>TIDEBINDER needs JavaScript to play.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
